<!doctype html>
<html lang="mg"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Varotra sy tahiry</title>
<style>
:root{--bg:#f4f7f3;--sf:#fff;--tx:#17251d;--mu:#5f6f66;--br:#1f4d3a;--brt:#fff;--ac:#f2a900;--act:#2a1c00;--ln:#dbe3dc;--rd:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a14;--sf:#18251d;--tx:#eef4ef;--mu:#9bb0a3;--br:#4fb48a;--brt:#06180f;--ac:#f2b72b;--ln:#2a3b31;--rd:#ff8a80}}
:root[data-theme="dark"]{--bg:#101a14;--sf:#18251d;--tx:#eef4ef;--mu:#9bb0a3;--br:#4fb48a;--brt:#06180f;--ac:#f2b72b;--ln:#2a3b31;--rd:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:14px 14px 215px}
h1{font-size:22px;margin:4px 0 14px;letter-spacing:-.3px}
h2{font-size:17px;margin:18px 0 8px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
input{font:inherit;color:var(--tx);background:var(--sf);border:1.5px solid var(--ln);border-radius:10px;padding:11px 12px;width:100%}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{background:var(--sf);border:1.5px solid var(--ln);border-radius:16px;padding:0;overflow:hidden;text-align:left;position:relative}
.tile:active{transform:scale(.97)}
.ph{height:96px;background:var(--ln);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.em{font-size:44px}
.tb{padding:8px 10px 10px}
.tb b{display:block}
.tb span{font-size:13px;color:var(--mu)}
.bd{position:absolute;top:8px;right:8px;background:var(--ac);color:var(--act);font-weight:700;font-size:13px;border-radius:999px;padding:2px 9px}
.row{display:flex;align-items:center;gap:12px;background:var(--sf);border:1.5px solid var(--ln);border-radius:12px;padding:8px;margin-bottom:8px}
.row .ph{width:56px;height:56px;border-radius:10px;flex:none}
.row .em{font-size:28px}
.row .g{flex:1;min-width:0}
.row .g span{font-size:13px;color:var(--mu);display:block}
.low{color:var(--rd)!important;font-weight:600}
.btn{background:var(--br);color:var(--brt);border-radius:12px;padding:13px 16px;font-weight:600;width:100%}
.btn.o{background:transparent;border:1.5px solid var(--br);color:var(--br)}
.btn.d{background:transparent;color:var(--rd);border:1.5px solid var(--rd)}
.btn:disabled{opacity:.4}
.sm{background:var(--ln);border-radius:8px;padding:7px 12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sf);border:1.5px solid var(--br);color:var(--tx);border-radius:999px;padding:11px 16px;font-weight:600;min-width:64px}
.chip:disabled{opacity:.35;border-color:var(--ln)}
textarea{font:inherit;color:var(--tx);background:var(--sf);border:1.5px solid var(--ln);border-radius:10px;padding:11px 12px;width:100%;height:90px;margin-top:8px}.plus.minus{background:var(--rd);color:var(--brt)}.btn.r{background:var(--rd);color:var(--brt)}.bd.red{background:var(--rd);color:var(--brt)}.tile.out{opacity:.65}.shop{background:var(--br);color:var(--brt);border-radius:14px;padding:10px 12px;margin-bottom:12px}.shop label{color:inherit;opacity:.85;margin:0 0 4px}.plus{width:72px;flex:none;background:var(--ac);color:var(--act);border-radius:14px;font-size:38px;font-weight:700;line-height:1}.plus.on{box-shadow:0 0 0 3px var(--br)}.chip small{display:block;font-size:12px;color:var(--mu);font-weight:500}.bar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;padding:0 14px}
.bar .btn{background:var(--ac);color:var(--act);display:flex;justify-content:space-between;font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1.5px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;padding:16px 0 14px;font-weight:600;color:var(--mu)}
nav button.on{color:var(--br);box-shadow:inset 0 3px 0 var(--br)}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.sh{display:none;position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:94%;overflow:auto;z-index:21}
.op .ov,.op .sh{display:block}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}
.mu{color:var(--mu)}
.ln{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--ln)}
.stat{display:flex;gap:10px}
.stat div{flex:1;background:var(--sf);border:1.5px solid var(--ln);border-radius:14px;padding:12px}
.stat b{display:block;font-size:19px}
#pv{height:110px;border-radius:12px;background:var(--ln);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px}
#pv img{width:100%;height:100%;object-fit:cover}
#tt{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;display:none}
.srch{margin:0 0 12px}
.chip.on{background:var(--br);color:var(--brt)}
.bad{border-color:var(--rd)!important}
.mb{background:var(--sf);border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;margin-top:10px}
.mb input{margin-bottom:4px}
#pov{display:none;position:fixed;inset:0;z-index:30}
#pop{display:none;position:fixed;z-index:31;background:var(--sf);border:1.5px solid var(--ln);border-radius:18px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.3);width:max-content;max-width:calc(100vw - 16px)}
body.pp #pov,body.pp #pop{display:block}
.pn{font-size:13px;color:var(--mu);padding:0 6px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.pb{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.qk{background:var(--br);color:var(--brt);border-radius:14px;padding:8px 12px;text-align:center;min-width:64px}
.qk b{display:block;font-size:15px}.qk small{display:block;font-size:11px;opacity:.85}
.dt{background:var(--ln);color:var(--tx);border-radius:14px;width:46px;font-size:22px;font-weight:700;line-height:1}
.mq{display:flex;gap:6px;align-items:center;margin-bottom:8px;overflow-x:auto}
.mq .ml{flex:none;font-size:12px;font-weight:600;background:var(--sf);border:1.5px solid var(--ln);border-radius:999px;padding:6px 10px;color:var(--mu)}
.mo{flex:none;background:var(--ac);color:var(--act);border-radius:999px;padding:6px 14px;font-weight:700;font-size:15px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.mo small{display:block;font-size:10px;font-weight:600;opacity:.8}
.pq{font-size:15px;font-weight:500;color:var(--mu);margin-left:8px;letter-spacing:0;white-space:nowrap}
.stk{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 8px;margin-bottom:4px}
.stk .srch{margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:6}
.sm.rd{background:var(--rd);color:var(--brt)}
.row .bt{display:flex;gap:6px;flex:none}
.pm .big{margin:8px 0!important}
.pm .chips{margin-top:6px!important}
.pm label{margin:6px 0 3px}
label.ck{display:flex;gap:10px;align-items:flex-start;color:var(--tx);font-size:14px;margin:14px 0}
.ck input{width:22px;height:22px;flex:none;padding:0;margin:0}
</style></head><body>
<div id="main"></div>
<div id="bar"></div>
<nav><button id="t-vente" onclick="go('vente')">Varotra</button><button id="t-stock" onclick="go('stock')">Tahiry</button><button id="t-bilan" onclick="go('bilan')">Tatitra</button></nav>
<div class="ov" onclick="closeSheet()"></div><div class="sh" id="sh"></div><div id="pov" onclick="closePop()"></div><div id="pop"></div><div id="tt"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>Math.round(n).toLocaleString("fr-FR")+" Ar";
const num=v=>parseFloat(String(v).replace(",","."))||0;
const KEY="caisse-v1";
let S={products:[],sales:[]},cart=[],tab="vente",tmpPhoto=null;
const demo=()=>[
{id:"p1",name:"Tomates",emoji:"🍅",photo:null,buy:2000,sell:3000,stock:25},
{id:"p2",name:"Oignons",emoji:"🧅",photo:null,buy:1800,sell:2500,stock:18},
{id:"p3",name:"Carottes",emoji:"🥕",photo:null,buy:2500,sell:3500,stock:12},
{id:"p4",name:"Pommes de terre",emoji:"🥔",photo:null,buy:2000,sell:2800,stock:30},
{id:"p5",name:"Riz",emoji:"🍚",photo:null,buy:2600,sell:3200,stock:40}];
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);S.products.forEach(fixP);return}}catch(e){}S={products:demo(),sales:[]};S.products.forEach(fixP)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Feno ny memoria, ahena ny sary")}}
const ORD=["kg","isany","litre","kapoaka"];
const U={kg:{s:"kg",f:"kilao",b:"kg"},isany:{s:"isa",f:"isany",b:"isany"},litre:{s:"l",f:"litre",b:"litre"},kapoaka:{s:"kpk",f:"kapoaka",b:"kapoaka"}};
const LIST={kg:[0.125,0.25,0.5,1,2,3,4,5],litre:[0.125,0.25,0.5,1,2,3,4,5],kapoaka:[0.5,1,2,3,4,5],isany:[1,2,3,4,5]};
const NAMED={kg:{0.125:"Atsasakin’ny Fahefany",0.25:"Fahefany",0.5:"Atsasany"},litre:{0.125:"Atsasakin’ny Fahefany",0.25:"Fahefany",0.5:"Atsasany"},kapoaka:{0.5:"Tapany"},isany:{}};
const FR={0.125:"1/8",0.25:"1/4",0.375:"3/8",0.5:"1/2",0.75:"3/4"};
function fnum(q){q=+q||0;const w=Math.floor(q+1e-3),f=q-w;if(f<1e-3)return String(w);for(const k in FR)if(Math.abs(f-k)<1e-3)return (w?w+" ":"")+FR[k];return String(Math.round(q*100)/100).replace(".",",")}
const fq=(q,m)=>fnum(q)+" "+U[m||"kg"].s;
const nmc=(q,m)=>NAMED[m][q]||fnum(q);
const chipL=(q,m)=>NAMED[m][q]||fnum(q)+" "+U[m].s;
function fixP(p){p.unit=U[p.unit]?p.unit:"kg";let m=Array.isArray(p.modes)?p.modes.filter(x=>U[x]):[];if(!m.length)m=[p.unit];p.modes=ORD.filter(x=>m.includes(x));p.conv=p.conv||{};p.prices=p.prices||{};return p}
const P=id=>S.products.find(p=>p.id===id);
const cv=(p,m)=>m===p.unit?1:(p.conv[m]>0?p.conv[m]:1);
const price=(p,m)=>m===p.unit?p.sell:(p.prices[m]>0?p.prices[m]:p.sell/cv(p,m));
const buyOf=(p,m)=>p.buy/cv(p,m);
const toSt=(p,m,q)=>q/cv(p,m);
const lines=id=>cart.filter(c=>c.id===id);
const inCart=id=>lines(id).reduce((a,c)=>a+toSt(P(id),c.mode,c.q),0);
const avail=p=>+(p.stock-inCart(p.id)).toFixed(6);
const cartTotal=()=>cart.reduce((a,c)=>a+price(P(c.id),c.mode)*c.q,0);
const dmode=p=>p.modes.includes(p.unit)?p.unit:p.modes[0];
function toast(m){const t=$("#tt");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",1800)}
const thumb=p=>p.photo?`<img src="${p.photo}" alt="">`:`<span class="em">${p.emoji||"📦"}</span>`;
function go(t){tab=t;render()}
function openSheet(h){$("#sh").innerHTML=h;document.body.classList.add("op")}
function closeSheet(){document.body.classList.remove("op")}
let vq="";
const norm=t=>(t||"").toString().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
function gridHtml(){const k=norm(vq),L=S.products.filter(p=>!k||norm(p.name).includes(k));if(!L.length&&S.products.length)return `<p class="mu" style="grid-column:1/-1">Tsy hita ny entana.</p>`;return L.map(p=>{const n=lines(p.id).map(c=>fq(c.q,c.mode)).join(" + "),o=p.stock<=0;return `<button class="tile${o?" out":""}" onclick="openPop(event,'${p.id}')">${o?`<span class="bd red">Tsy misy intsony</span>`:n?`<span class="bd">${n}</span>`:""}<div class="ph">${thumb(p)}</div><div class="tb"><b>${esc(p.name)}</b><span>${p.modes.map(m=>money(price(p,m))+" / "+U[m].s).join(" · ")}</span></div></button>`}).join("")}
let tq="";
function stockRows(){const k=norm(tq),L=S.products.filter(p=>!k||norm(p.name).includes(k));return {n:L.length,h:L.map(p=>`<div class="row"><div class="ph">${thumb(p)}</div><div class="g"><b>${esc(p.name)}</b><span class="${p.stock<1?"low":""}">${fq(p.stock,p.unit)} ao anaty tahiry</span><span>Fividianana ${money(p.buy)} / ${U[p.unit].s} · Fivarotana ${money(p.sell)} / ${U[p.unit].s}</span><span>Varotra amin’ny : ${p.modes.map(m=>U[m].s).join(" · ")}</span></div><button class="sm" onclick="openForm('${p.id}')">Ovay</button></div>`).join("")||(S.products.length?`<p class="mu">Tsy hita ny entana.</p>`:"")}}
function render(){
 ["vente","stock","bilan"].forEach(t=>$("#t-"+t).classList.toggle("on",t===tab));
 let h="",bar="";
 if(tab==="vente"){
  h=`<h1>Varotra</h1><div class="shop"><label>Anaran’ny fivarotana (hita eo an-doha ny faktiora)</label><input value="${esc(S.shop||"")}" placeholder="ohatra : Tsena Rakoto" oninput="setShop(this.value)"></div><div class="stk"><input id="srch" type="search" class="srch" placeholder="🔍 Hikaroka entana..." value="${esc(vq)}" oninput="vq=this.value;$('#pg').innerHTML=gridHtml()" autocomplete="off"></div><div class="grid" id="pg">${gridHtml()}</div>`;
  if(!S.products.length)h+=`<p class="mu">Tsy mbola misy entana. Ampio ao amin’ny Tahiry.</p>`;
  if(cart.length){const t=Math.round(cartTotal());bar=`<div class="bar"><div class="mq"><span class="ml">Nomena :</span>`+moneySugg(t).map(v=>`<button class="mo" onclick="payQuick(${v})">${v.toLocaleString("fr-FR")}<small>${v===t?"vola tonga":"miverina "+(v-t).toLocaleString("fr-FR")}</small></button>`).join("")+`</div><button class="btn" onclick="openCart()"><span>Harona (${cart.length})</span><span>${money(cartTotal())}</span></button></div>`}
 }else if(tab==="stock"){
  h=`<h1>Tahiry</h1><div class="stk"><button class="btn" onclick="openForm()">Hanampy entana</button><input id="tsrch" type="search" class="srch" style="margin-top:8px" placeholder="🔍 Hikaroka entana..." value="${esc(tq)}" oninput="tq=this.value;const r=stockRows();$('#sl').innerHTML=r.h;$('#sc').textContent=r.n+' entana'" autocomplete="off"></div><h2 id="sc">${stockRows().n} entana</h2><div id="sl">${stockRows().h}</div>`;
 }else{
  const d=new Date().toDateString(),ts=S.sales.filter(s=>new Date(s.date).toDateString()===d);
  const tot=ts.reduce((a,s)=>a+s.total,0),ben=ts.reduce((a,s)=>a+s.lines.reduce((b,l)=>b+(l.sell-l.buy)*l.q,0),0);
  h=`<h1>Tatitra androany</h1><div class="stat"><div><span class="mu">Varotra</span><b>${money(tot)}</b></div><div><span class="mu">Tombony</span><b>${money(ben)}</b></div></div><h2>Varotra androany : ${ts.length}</h2>`+(ts.length?ts.slice().reverse().map(s=>`<div class="row"><div class="g"><b>${money(s.total)}</b><span>${new Date(s.date).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})} · ${s.lines.length} entana</span></div><div class="bt"><button class="sm" onclick="showInvoice('${s.id}')">Faktiora</button><button class="sm rd" onclick="askRefund('${s.id}')">Averina</button></div></div>`).join(""):`<p class="mu">Mbola tsy misy varotra.</p>`)+`<p><button class="btn o" onclick="openBackup()" style="margin-bottom:8px">Tahirizina</button><button class="btn r" onclick="askDel()">Fafana ny tatitra</button></p>`;
 }
 $("#main").innerHTML=h;$("#bar").innerHTML=bar;
}

const DEF={kg:[1,0.5,2],litre:[1,0.5,2],kapoaka:[1,2,3],isany:[1,2,3]};
const MON=[200,500,1000,2000,5000,10000,20000];
function moneySugg(t){let u=MON.filter(v=>v>=t).slice(0,3);if(!u.length)u=[Math.ceil(t/20000)*20000];return u}
function payQuick(v){openPay();pay.parts=[v];pay.ok=true;pay.plus=false;payCalc();const b=$("#ok");if(b&&b.scrollIntoView)b.scrollIntoView({block:"nearest"})}
function quickList(p){
 const a=avail(p),ok=(m,q)=>toSt(p,m,q)<=a+1e-6,cnt={};
 S.sales.forEach((s,si)=>s.lines.forEach(l=>{if(l.pid?l.pid===p.id:l.name===p.name){const m=l.unit||"kg";if(!p.modes.includes(m)||!(l.q>0))return;const k=m+"|"+l.q,o=cnt[k]||(cnt[k]={m,q:l.q,n:0,t:0});o.n++;o.t=si}}));
 const out=Object.values(cnt).filter(x=>ok(x.m,x.q)).sort((x,y)=>y.n-x.n||y.t-x.t).slice(0,3),seen=new Set(out.map(x=>x.m+"|"+x.q));
 const ms=[dmode(p)].concat(p.modes.filter(m=>m!==dmode(p)));
 for(let i=0;i<3&&out.length<3;i++)ms.forEach(m=>{const q=DEF[m][i];if(q==null||out.length>=3)return;const k=m+"|"+q;if(seen.has(k)||!ok(m,q))return;seen.add(k);out.push({m,q})});
 return out;
}
function openPop(ev,id){
 const p=P(id);if(!p)return;if(p.stock<=0){toast("Lany");return}
 const r=ev.currentTarget.getBoundingClientRect(),pop=$("#pop");
 pop.innerHTML=`<div class="pn">${esc(p.name)}</div><div class="pb">`+quickList(p).map(x=>`<button class="qk" onclick="quickAdd('${id}','${x.m}',${x.q})"><b>${fq(x.q,x.m)}</b><small>${money(price(p,x.m)*x.q)}</small></button>`).join("")+`<button class="dt" aria-label="Antsipiriany" title="Antsipiriany" onclick="closePop();openQty('${id}')">⋯</button></div>`;
 document.body.classList.add("pp");
 const w=pop.offsetWidth,h=pop.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;
 let left=Math.max(8,Math.min(r.left+r.width/2-w/2,vw-w-8)),top=r.bottom+6;
 if(top+h>vh-70)top=r.top-h-6;
 pop.style.left=left+"px";pop.style.top=Math.max(8,top)+"px";
}
function closePop(){document.body.classList.remove("pp")}
function quickAdd(id,m,q){closePop();addCart(id,q,m)}
function openQty(id,neg,fromCart,mode){
 const p=P(id);if(!p)return;if(p.stock<=0&&!neg){toast("Lany");return}
 const m=mode||dmode(p);qb={parts:[],op:null,minus:!!neg,fromCart:!!fromCart,mode:m,id};
 const a=+(neg?(lines(id).find(c=>c.mode===m)||{q:0}).q:avail(p)*cv(p,m)).toFixed(4),L=LIST[m];
 const tg=(!neg&&p.modes.length>1)?`<div class="chips" style="margin-bottom:10px">`+p.modes.map(x=>`<button class="chip${x===m?" on":""}" onclick="qbMode('${id}','${x}')">${U[x].s}</button>`).join("")+`</div>`:"";
 openSheet(`<h2 style="margin-top:0">${esc(p.name)}</h2><p class="mu">${money(price(p,m))} / ${U[m].s} · ${neg?"ao anaty harona":"sisa"} ${fq(a,m)}</p>${tg}<div class="chips">`+L.map(q=>`<button class="chip" ${q>a+1e-9?"disabled":""} onclick="qbAdd(${q})">${chipL(q,m)}</button>`).join("")+`</div><label>Safidio ny habetsaha eo ambony (azo ampiana amin’ny +), na soraty ny isa (${U[m].s}) eto</label><div style="display:flex;gap:8px"><input id="cq" type="number" step="any" min="0" inputmode="decimal" placeholder="ex. 1" oninput="qbPrev()"><button id="pl" class="plus" onclick="qbPlus()">+</button><button id="mn" class="plus minus${neg?" on":""}" onclick="qbMinus()">−</button></div><p id="qp" class="big" style="margin:14px 0">${neg?"Esory : ":""}0 ${U[m].s}</p><div style="display:flex;gap:8px"><button class="btn o" style="width:auto" onclick="qbClr()">Fafao</button><button class="btn" onclick="qbOk('${id}')" id="qa">${neg?"Esory":"Ampio"}</button></div>`);

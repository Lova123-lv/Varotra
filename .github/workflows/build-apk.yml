name: Build APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparer
        run: |
          mkdir -p www assets
          cp caisse-stock.html www/index.html
          python3 - <<'PY'
          import zlib, struct, math
          S=1024
          def dist(px,py,x1,y1,x2,y2):
              dx,dy=x2-x1,y2-y1
              t=max(0,min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy)))
              return math.hypot(px-(x1+t*dx),py-(y1+t*dy))
          rows=[]
          for y in range(S):
              row=bytearray([0])
              for x in range(S):
                  if dist(x,y,330,330,512,720)<62 or dist(x,y,694,330,512,720)<62:
                      c=(42,28,0)
                  elif math.hypot(x-512,y-512)<392:
                      c=(242,169,0)
                  else:
                      c=(31,77,58)
                  row+=bytes(c)
              rows.append(bytes(row))
          raw=b"".join(rows)
          def ch(t,d):
              c=struct.pack(">I",len(d))+t+d
              return c+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
          png=b"\x89PNG\r\n\x1a\n"+ch(b"IHDR",struct.pack(">IIBBBBB",S,S,8,2,0,0,0))+ch(b"IDAT",zlib.compress(raw,9))+ch(b"IEND",b"")
          open("assets/icon-only.png","wb").write(png)
          PY
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/assets@4
          npx cap init "Varotra sy tahiry" mg.varotra.caisse --web-dir www
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Compiler
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: varotra-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
